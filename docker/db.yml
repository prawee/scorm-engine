services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scormflow
      POSTGRES_PASSWORD: scormflow
      POSTGRES_DB: scormflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U scormflow -d scormflow" ]
      interval: 5s
      timeout: 5s
      retries: 10
