include:
  - db.yml
  - redis.yml

services:
  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://scormflow:scormflow@postgres:5432/scormflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./data/engine-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

